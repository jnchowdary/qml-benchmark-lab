[pytest]
# `tests/` is this study's suite. `product/qaudit` is an installable package
# with its own pyproject and its own suite, run from inside it against the
# installed package, so collecting it from this root fails: `qaudit` is not on
# the path in the research environment.
#
# Added 26 October 2026. Commit f4846b7 put that package in this tree, and from
# then until now a bare `pytest` here died on three collection errors while
# `make test` kept working, because the Makefile scopes itself to tests/. The
# README documents `make test`, so nothing a reader was told to run was broken
# -- but a bare `pytest` is what anyone tries first, and leaving it erroring in
# a repository whose paper invites reproduction is a trap.
testpaths = tests
norecursedirs = product .git __pycache__ data results arxiv node_modules .venv
